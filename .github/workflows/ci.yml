name: Generate CI artifacts
run-name: CI em ${{ github.ref_name }} por ${{ github.actor }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (README + site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Falha se content/pt-br.md e content/en.md tiverem estruturas diferentes
      # ou campos obrigatórios ausentes.
      - name: Gerar READMEs
        run: npm run build:readme
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verificar READMEs versionados
        run: git diff --exit-code -- README.md README.en.md

      - name: Gerar site
        run: npm run build:site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

  release:
    name: Release automático
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Criar release com Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
