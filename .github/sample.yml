settings:
  username: clcmo
  commit_msg: "⚡ Atualizar README com a atividade recente"
  max_lines: 5
  readme_file: "./content/pt-br.md"
  disabled_events:
    - "comentários"
  url_text: "{REPO}{ID}"
  date:
    timezone: "GMT-03:00"
    text: "Última atualização: {DATE}"
    format: "dddd, mmmm dS, yyyy, h:MM:ss TT"
  commit_name: "readme-bot"
  commit_email: "41898282+github-actions[bot]@users.noreply.github.com"
  line_prefix: "{NUM}. "
  ignored_repos:
    - clcmo/clcmo
messages:
  comments: "💬 Comentou em {ID} em {REPO}"
  push: "⬆️ Enviou {AMOUNT} commit(s) para {REPO}"
  issue_opened: "❗️ Abriu a questão {ID} em {REPO}"
  issue_closed: "✔️ Fechou a questão {ID} em {REPO}"
  pr_opened: "💪 PR {ID} aberto em {REPO}"
  pr_closed: "❌ PR {ID} fechado em {REPO}"
  pr_merged: "🎉 PR {ID} mesclado em {REPO}"
  create_repo: "📔 Novo repositório {REPO} criado"
  fork_repo: "🔱 {FORK} bifurcado de {REPO}"
  wiki_create: "📖 Nova página wiki {WIKI} criada em {REPO}"
  added_member: "🤝 Tornei-me colaborador em {REPO}"
  changes_approved: "👍 {ID} aprovado em {REPO}"
  changes_requested: "🔴 Alterações solicitadas em {ID} em {REPO}"
  new_release: "✌️ {ID} lançado em {REPO}"
  new_star: "⭐ {REPO} marcado com estrela"
